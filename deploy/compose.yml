# The production stack (Phase 10c): one server running Caddy, the api, the worker and Postgres.
# On the server, from the repository root:
#   cp deploy/.env.example deploy/.env    # then fill it in (see docs/DEPLOYMENT.md)
#   docker compose -f deploy/compose.yml up -d --build
# Only Caddy is reachable from outside (ports 80 and 443). Postgres and the api are on the private network.
name: kots-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-server: &server
  image: kots-server:${KOTS_VERSION:-latest}
  build: { context: .., dockerfile: deploy/Dockerfile, target: server }
  env_file: .env
  environment:
    DATABASE_URL: postgres://kots:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/kots
    API_PORT: "4100"
    TRUST_PROXY: "1"
  logging: *logging

services:
  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: kots
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kots -d kots"]
      interval: 5s
      retries: 30
    logging: *logging

  # Runs once per `up`: applies pending migrations, then loads the static content (map, goods, market stock; safe to
  # repeat, never resets live state). The api and worker wait for it to succeed.
  migrate:
    <<: *server
    command: ["sh", "-c", "node dist/migrate.cjs && node dist/seed.cjs"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *server
    command: ["node", "dist/api.cjs"]
    restart: unless-stopped
    # The api exits within its own 10 s shutdown deadline; this is Docker's limit before it kills the process.
    stop_grace_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *server
    command: ["node", "dist/worker.cjs"]
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: kots-web:${KOTS_VERSION:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

volumes:
  db-data:
  # Caddy's certificates and keys. Keep this volume: losing it means re-issuing certificates (rate-limited).
  caddy-data:
  caddy-config:
